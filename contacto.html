<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./assets/css/style.css" rel="stylesheet"/>
        <title>Contacto | Mi ECommerce</title>
    </head>

    <body class="m-0 font-[Arial,sans-serif]">
        <header>
            <h1 class="ml-[1%] font-[Arial] text-[15px] font-bold">Mi ECommerce</h1>
            <nav class="bg-[blue] p-[15px]">
                <a class="mr-[15px] text-white" href="index.html">Inicio</a>
                <a class="mr-[15px] text-white" href="#">Productos</a>
                <a class="mr-[15px] text-white" href="contacto.html">Contacto</a>
            </nav>
        </header>

        <main class="mt-[5%] p-[20px] text-center">
            <h2 class="mb-4 font-bold text-[24px]">Formulario de contacto</h2>

            <form onsubmit="return validarFormulario()">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono" required>

                <label for="mensaje">Mensaje:</label>
                <textarea class="area_texto" id="mensaje" name="mensaje" rows="5" required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </main>

        <footer class="mt-[30%] bg-black p-[15px] text-center text-white">
            <p>Equipo: Benjamín Cubillos - Cristobal Pardo - Renato Troncoso | 2026</p>
        </footer>
        <script src="./assets/js/funciones.js"></script>
    </body>
</html>
