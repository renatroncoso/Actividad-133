<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="./assets/css/style.css" rel="stylesheet"/>
        <title>Contacto | Mi ECommerce</title>
    </head>

    <body class="m-0 font-[Arial]">
        <header class="bg-[blue] p-[20px] text-center text-white">
            <h1 class="mb-3 text-[20px]">Mi ECommerce</h1>
            <nav>
                <a class="mr-[15px] underline" href="index.html">Inicio</a>
                <a class="mr-[15px] underline" href="#">Productos</a>
                <a class="underline" href="contacto.html">Contacto</a>
            </nav>
        </header>

        <main class="ml-[20%] mr-[20%] mt-[5%] font-[Arial,sans-serif] text-[20px] leading-[1.6] text-[#333]">
            <h2 class="mb-4 text-center text-[20px]">Formulario de contacto</h2>

            <form class="text-[15px]" onsubmit="return validarFormulario()">

                <div class="mb-3">
                    <label class="mb-3 block" for="nombre">Nombre</label>
                    <input type="text" class="w-full border p-[15px]" id="nombre">
                </div>

                <div class="mb-3">
                    <label class="mb-3 block" for="correo">Correo electrónico</label>
                    <input type="email" class="w-full border p-[15px]" id="correo">
                </div>

                <div class="mb-3">
                    <label class="mb-3 block" for="telefono">Teléfono</label>
                    <input type="text" class="w-full border p-[15px]" id="telefono">
                </div>

                <div class="mb-3">
                    <label class="mb-3 block" for="mensaje">Mensaje</label>
                    <textarea class="w-full resize border p-[15px]" id="mensaje"></textarea>
                </div>

                <button type="submit" class="bg-[blue] p-[15px] text-white">
                    Enviar
                </button>

            </form>
        </main>

        <footer class="mt-[30%] bg-black p-[15px] text-center text-[15px] text-white">
            <p>Equipo: Benjamín Cubillos - Cristobal Pardo - Renato Troncoso | 2026</p>
        </footer>
        <script src="./assets/js/funciones.js"></script>
    </body>
</html>
